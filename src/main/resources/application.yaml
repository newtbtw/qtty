spring:
  application:
    name: qtty
    version: 0.0.1
  main:
    web-application-type: none
  data:
    jdbc:
      dialect: postgresql
  flyway:
    enabled: true
    baseline-on-migrate: true
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      api-key: ${OPENAI_KEY}
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5-coder:14b

  autoconfigure:
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver

logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss

xai:
  key: ${XAI_KEY}

tmdb:
  key: ${TBDB_KEY}

storage:
  s3:
    enabled: ${STORAGE_S3_ENABLED:false}
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_S3_REGION:us-east-1}
    access-key: ${STORAGE_S3_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_S3_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_S3_BUCKET:qtty-images}
    path-style-access: ${STORAGE_S3_PATH_STYLE_ACCESS:true}
    create-bucket-if-missing: ${STORAGE_S3_CREATE_BUCKET_IF_MISSING:true}
    public-base-url: ${STORAGE_S3_PUBLIC_BASE_URL:}
